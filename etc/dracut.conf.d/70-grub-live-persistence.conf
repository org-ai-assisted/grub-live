## AI-Assisted

## Updatable boot under a persistent live overlay: a kernel upgrade in the live
## session regenerates the initramfs, and that regenerated initrd MUST still be
## able to mount the dmsquash-live medium, union the overlay, and unlock a LUKS
## overlay -- otherwise the upgraded kernel cannot boot persistent.
##
## Sorts AFTER 60-dist-base-files.conf (which sets hostonly="yes"): a hostonly
## initrd is pruned to the CURRENT boot's storage and would drop the live/overlay/
## crypt modules on regeneration. Force a generic, live-capable initrd instead.
## grub-live ships only on live images, so this does not bloat installed systems.
hostonly="no"

## Guarantee the live-boot stack survives a kernel-upgrade regeneration even if
## hostonly is re-enabled elsewhere. 'bash' matches the ISO initrd (the live/
## overlay/crypt hook scripts are bash, not the dash/busybox default shell).
force_add_dracutmodules+=" dmsquash-live overlay-root crypt bash "
